<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SMART SF9 Premium</title>
<style>
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#17191d;color:#fff}
#loading{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
.card{max-width:420px;background:#231f24;border:1px solid #3a3137;border-radius:20px;padding:28px;box-shadow:0 18px 60px rgba(0,0,0,.35)}
.brand{font-size:28px;font-weight:900}.brand span{color:#ef4b8b}.sub{margin-top:8px;color:#d9cbd2;font-size:13px;line-height:1.5}
.bar{height:8px;background:#382f35;border-radius:999px;overflow:hidden;margin-top:18px}.bar i{display:block;height:100%;width:28%;background:#ef4b8b;border-radius:999px;animation:load 1.2s infinite ease-in-out}
@keyframes load{0%{transform:translateX(-120%)}100%{transform:translateX(430%)}}
</style></head><body>
<div id="loading"><div class="card"><div class="brand">SMART <span>SF9</span></div><div class="sub">Loading your Premium workspace…<br>Please keep this page open for a moment.</div><div class="bar"><i></i></div></div></div>
<script>
(async function(){
  const files=["deploy_comments_v1/part001.txt","deploy_comments_v1/part002.txt","deploy_comments_v1/part003.txt","deploy_comments_v1/part004.txt","deploy_comments_v1/part005.txt","deploy_comments_v1/part006.txt","deploy_comments_v1/part007.txt","deploy_comments_v1/part008.txt","deploy_comments_v1/part009.txt","deploy_comments_v1/part010.txt","deploy_comments_v1/part011.txt","deploy_comments_v1/part012.txt","deploy_comments_v1/part013.txt","deploy_comments_v1/part014.txt","deploy_comments_v1/part015.txt","deploy_comments_v1/part016.txt","deploy_comments_v1/part017.txt","deploy_comments_v1/part018.txt","deploy_comments_v1/part019.txt","deploy_comments_v1/part020.txt","deploy_comments_v1/part021.txt","deploy_comments_v1/part022.txt","deploy_comments_v1/part023.txt","deploy_comments_v1/part024.txt","deploy_comments_v1/part025.txt","deploy_comments_v1/part026.txt","deploy_comments_v1/part027.txt"];
  try{
    const parts=[];
    for(const f of files){
      const r=await fetch(f,{cache:'no-store'});
      if(!r.ok) throw new Error(f+' '+r.status);
      parts.push(await r.text());
    }
    const html=parts.join('');
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById('loading').innerHTML='<div class="card"><div class="brand">SMART <span>SF9</span></div><div class="sub">Could not load the app. Please refresh the page.<br><br>'+String(e)+'</div></div>';
  }
})();
</script></body></html>
